[build-system]
requires = ["setuptools>=77"]  # for the SPDX "license" field
build-backend = "setuptools.build_meta"

[project]
name = "staticfx"
dynamic = ["version"]
description = "Animated ASCII effects for your terminal, with a studio for making your own"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ethanlabs101" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["terminal", "ascii", "animation", "cmatrix", "screensaver", "tui", "ascii-art"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/ethanlabs101/StaticFX"
Documentation = "https://github.com/ethanlabs101/StaticFX/blob/main/docs/USAGE.md"
Changelog = "https://github.com/ethanlabs101/StaticFX/blob/main/CHANGELOG.md"
Issues = "https://github.com/ethanlabs101/StaticFX/issues"

[project.scripts]
staticfx = "staticfx.cli:main"

[tool.setuptools.dynamic]
version = { attr = "staticfx.__version__" }

[tool.setuptools.packages.find]
include = ["staticfx*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # effect maths has many branches and knobs
    "PLR2004",                                   # magic numbers are the point of an effect
    "PLW2901",                                   # reassigning loop vars is idiomatic in hot loops
    "PLR0917",                                   # covered by keyword-only params where it matters
    "RUF001", "RUF003",                          # intentional Unicode glyphs
    "SIM905",                                    # "a b c".split() reads better for word lists
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]
"tools/*" = ["E402"]  # scripts put the repo on sys.path before importing staticfx

[tool.mypy]
python_version = "3.10"
files = ["staticfx"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: exhaustive checks over every effect (deselect with -m 'not slow')"]
